<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Flexachem workshop job tracker — service jobs, dates and blockers in one dashboard." />
    <meta name="theme-color" content="#0a1f3d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Flexachem Workshop Tracker</title>
  </head>
  <body>
    <script>
      // Apply the persisted (or default dark) theme before first paint — no flash.
      try {
        var t = localStorage.getItem("flexachem_theme_v2") || "dark";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) { document.documentElement.classList.add("dark"); }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
