# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# NOTE: trustStoreType=WINDOWS-ROOT (the Capacitor default) was replaced. This machine
# has HTTPS/SSL inspection (a private root CA in the Windows cert store), and the Android
# Studio JBR lacks the SunMSCAPI provider needed to read WINDOWS-ROOT — so downloads failed
# with "WINDOWS-ROOT not found", and the default JDK bundle failed with "PKIX path building
# failed". proxy-cacerts.p12 is a PKCS12 truststore built from the Windows root store (incl.
# the interception CA), so Gradle can validate dl.google.com / Maven Central. Regenerate with
# tools/regen-truststore.ps1 if the machine's roots change. Machine-specific; not for CI.
org.gradle.jvmargs=-Xmx1536m -Djavax.net.ssl.trustStore=C:/Users/Padraig/PersonalClaude/flexachem-workshop-tracker/android/proxy-cacerts.p12 -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=PKCS12

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
